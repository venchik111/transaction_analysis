[project]
name = "transaction_analysis"
version = "0.1.0"
description = "Учебный проект для анализа банковских операций"
requires-python = ">=3.14,<4.0"
dependencies = [
    "pandas>=3.0,<4.0",
    "openpyxl>=3.1.5,<4.0",
    "requests>=2.32,<3.0",
    "python-dotenv>=1.2,<2.0",
]

[build-system]
requires = ["poetry-core>=2.0,<3.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[dependency-groups]
dev = ["pytest>=9.0,<10.0", "pytest-cov>=7.0,<8.0"]
lint = [
    "black>=26.0,<27.0",
    "isort>=9.0,<10.0",
    "flake8>=7.3,<8.0",
    "mypy>=2.0,<3.0",
    "pandas-stubs>=3.0,<4.0",
    "types-requests>=2.32,<3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.black]
line-length = 119

[tool.isort]
profile = "black"
line_length = 119

[tool.mypy]
check_untyped_defs = true
